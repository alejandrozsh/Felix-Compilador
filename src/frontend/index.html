<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felix Compilador — IDE</title>
    <meta name="description" content="Felix: Compilador académico con análisis léxico, sintáctico, semántico, generación de cuádruples, optimización y generación de código ensamblador ARM64/x86_64.">
    <link rel="stylesheet" href="dist/output.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col p-4 bg-editor text-foreground font-mono">

    <header class="flex justify-center mb-4 space-x-2 border-b border-divider pb-2 relative items-center flex-wrap gap-y-2">
        <h1 class="text-blue-400 font-bold absolute left-4 text-xl">FELIX COMPILADOR</h1>
        
        <!-- Tabs principales -->
        <button id="tab-jj" onclick="setWorkspace('jj')" class="px-4 py-1 hover:bg-panel-hover rounded text-gray-300 transition-colors text-sm">Código .jj</button>
        <button id="tab-intermedio" onclick="setWorkspace('intermedio')" class="px-4 py-1 hover:bg-panel-hover rounded text-gray-300 transition-colors text-sm">Código Intermedio</button>
        <button id="tab-optimizado" onclick="setWorkspace('optimizado')" class="px-4 py-1 hover:bg-panel-hover rounded text-gray-300 transition-colors text-sm">Código Optimizado</button>

        <!-- Separador visual -->
        <span class="text-gray-600 mx-1">│</span>

        <!-- Tabs de ensamblador con badges -->
        <button id="tab-asm-arm64" onclick="setWorkspace('asm-arm64')" class="px-3 py-1 hover:bg-panel-hover rounded text-gray-300 transition-colors text-sm flex items-center gap-1">
            ASM ARM64
            <span id="badge-arm64" class="arch-badge disabled">—</span>
        </button>
        <button id="tab-asm-x86" onclick="setWorkspace('asm-x86')" class="px-3 py-1 hover:bg-panel-hover rounded text-gray-300 transition-colors text-sm flex items-center gap-1">
            ASM x86_64
            <span id="badge-x86" class="arch-badge disabled">—</span>
        </button>
    </header>

    <div class="flex flex-1 gap-0 overflow-hidden">
        
        <aside class="w-1/6 panel rounded-lg p-4 flex flex-col gap-4 overflow-y-auto min-w-[220px]" style="flex-shrink: 0;">
            <h2 class="text-sm text-gray-400 text-center mb-2">PROCESOS DE OPTIMIZACIÓN</h2>
            
            <button onclick="loadExample('cse')" class="opt-btn">
                Local: Eliminación de subexpresiones
            </button>
            <button onclick="loadExample('copy')" class="opt-btn">
                Local: Propagación de copias
            </button>
            <button onclick="loadExample('loop')" class="opt-btn">
                Ciclos: Reducción de frecuencia
            </button>
            <button onclick="loadExample('libre')" class="opt-btn" style="border-color: #3b82f6; margin-top: 10px;">
                📝 Modo Libre (Bloc de notas)
            </button>
            
            <div class="mt-auto pt-4 border-t border-divider text-xs text-gray-400" id="explicacion-dict">
                Selecciona una optimización para ver su explicación.
            </div>

            <!-- Indicador de arquitectura -->
            <div class="arch-indicator" id="arch-indicator">
                <div class="arch-name" id="arch-name">Detectando...</div>
                <div class="arch-detail" id="arch-detail">Consultando servidor</div>
            </div>

            <div class="pt-4 border-t border-divider">
                <button onclick="compileCode()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded shadow-lg transition-colors">
                    ▶ EJECUTAR FELIX
                </button>
            </div>
        </aside>

        <!-- Separador sidebar-workspace -->
        <div class="resize-handle ml-2" data-handle="sidebar"></div>

        <main id="workspace" class="flex-1 flex gap-0 overflow-x-auto ml-2">
        </main>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
